<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenMarkerWiki - Indeks genów</title>
    <link rel="stylesheet" href="html/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero hero--index">
        <div class="hero__badge" aria-hidden="true">🧬</div>
        <h1>GenMarkerWiki</h1>
        <p>Indeks kart genów w repozytorium.</p>
      </section>

      <nav aria-label="Kategorie genów">
        <ul class="category-nav" id="category-nav"></ul>
      </nav>

      <div id="gene-sections"></div>

      <section class="rsid-index" id="rsid-index" aria-labelledby="rsid-index-title">
        <h2 id="rsid-index-title">Analizowane rsID</h2>
        <p class="rsid-index__lead">
          Główne i powiązane identyfikatory SNP z kart genów. Pierwszy wpis przy każdym genie to zwykle
          marker główny.
        </p>
        <div id="rsid-sections"></div>
      </section>

    <script src="html/gene-index.js"></script>
    <script src="html/gene-categories.js"></script>
    <script src="html/gene-rsids.js"></script>
    <script>
      const byGene = Object.fromEntries(window.GENE_INDEX.map((entry) => [entry.gene, entry]));

      function renderGeneCard({ gene, label, icon, tone }) {
        return `
        <a class="gene-card gene-card--${tone}" href="html/gene.html?gene=${encodeURIComponent(gene)}" data-tone="${tone}">
          <span class="gene-card__icon" aria-hidden="true">${icon}</span>
          <div class="gene-card__body">
            <strong>${gene}</strong>
            <span>${label}</span>
          </div>
        </a>`;
      }

      document.getElementById("category-nav").innerHTML = window.GENE_CATEGORIES.map(
        ({ id, label, icon, genes }) =>
          `<li><a href="#cat-${id}"><span aria-hidden="true">${icon}</span> ${label} <span class="category-head__count">(${genes.length})</span></a></li>`
      ).join("");

      document.getElementById("gene-sections").innerHTML = window.GENE_CATEGORIES.map(
        ({ id, label, icon, genes }) => {
          const cards = genes
            .map((symbol) => byGene[symbol])
            .filter(Boolean)
            .map(renderGeneCard)
            .join("");
          return `
          <section class="category-section" id="cat-${id}" aria-labelledby="cat-${id}-title">
            <h2 class="category-head" id="cat-${id}-title">
              <span class="category-head__icon" aria-hidden="true">${icon}</span>
              ${label}
              <span class="category-head__count">${formatGeneCount(genes.length)}</span>
            </h2>
            <div class="grid">${cards}</div>
          </section>`;
        }
      ).join("");

      const snpediaUrl = (rsid) =>
        `https://www.snpedia.com/index.php/${rsid.charAt(0).toUpperCase()}${rsid.slice(1)}`;

      function renderRsidItem({ gene, label }) {
        const rsids = (window.GENE_RSIDS && window.GENE_RSIDS[gene]) || [];
        const chips = rsids
          .map(
            (rsid, i) =>
              `<a class="rsid-chip${i === 0 ? " rsid-chip--primary" : ""}" href="${snpediaUrl(rsid)}" target="_blank" rel="noopener noreferrer">${rsid}</a>`
          )
          .join("");
        return `<li class="rsid-index__item">
          <a class="rsid-index__gene" href="html/gene.html?gene=${encodeURIComponent(gene)}">${gene}</a>
          <span class="rsid-index__label">${label}</span>
          <div class="rsid-index__chips">${chips || '<span class="rsid-index__empty">—</span>'}</div>
        </li>`;
      }

      document.getElementById("rsid-sections").innerHTML = window.GENE_CATEGORIES.map(
        ({ id, label, icon, genes }) => {
          const items = genes
            .map((symbol) => byGene[symbol])
            .filter(Boolean)
            .map(renderRsidItem)
            .join("");
          return `
          <section class="category-section" aria-labelledby="rsid-${id}-title">
            <h3 class="category-head" id="rsid-${id}-title">
              <span class="category-head__icon" aria-hidden="true">${icon}</span>
              ${label}
            </h3>
            <ol class="rsid-index__list">${items}</ol>
          </section>`;
        }
      ).join("");
    </script>
    </main>
  </body>
</html>
