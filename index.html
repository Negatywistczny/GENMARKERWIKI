<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenMarkerWiki - Indeks genów</title>
    <link rel="stylesheet" href="html/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero hero--index">
        <div class="hero__badge" aria-hidden="true">🧬</div>
        <h1>GenMarkerWiki</h1>
        <p>
          Indeks stron HTML dla wszystkich genów w repozytorium. Spis markdown:
          <a href="index.md">index.md</a>.
          Wersje do druku (4 strony, jasny motyw):
          <a href="html/print-index.html">karty do druku</a>,
          gotowe pliki: <a href="pdf/">PDF</a> (<span id="pdf-count">…</span>).
        </p>
      </section>

      <section class="grid" id="gene-grid"></section>
    <script src="html/gene-index.js"></script>
    <script>
      (async () => {
        const total = window.GENE_INDEX.length;
        let onDisk = 0;
        await Promise.all(
          window.GENE_INDEX.map(async ({ gene }) => {
            try {
              const r = await fetch(`pdf/${gene}.pdf`, { method: "HEAD" });
              if (r.ok) onDisk += 1;
            } catch {
              /* brak pliku */
            }
          })
        );
        const el = document.getElementById("pdf-count");
        if (el) {
          el.textContent =
            onDisk === total ? `${total} genów` : `${onDisk}/${total} genów`;
        }
      })();

      document.getElementById("gene-grid").innerHTML = window.GENE_INDEX.map(
        ({ gene, label, icon, tone }) => `
        <a class="gene-card gene-card--${tone}" href="html/gene.html?gene=${encodeURIComponent(gene)}" data-tone="${tone}">
          <span class="gene-card__icon" aria-hidden="true">${icon}</span>
          <div class="gene-card__body">
            <strong>${gene}</strong>
            <span>${label}</span>
          </div>
        </a>`
      ).join("");
    </script>
    </main>
  </body>
</html>
