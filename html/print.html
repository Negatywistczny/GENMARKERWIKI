<!doctype html>
<html lang="pl" class="print-mode">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Druk | GenMarkerWiki</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="print.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body data-mode="print">
    <main class="container print-shell">
      <section class="hero print-hero">
        <h1 id="gene-title">Karta do druku</h1>
        <p id="gene-subtitle">Wybierz gen w adresie URL, np. print.html?gene=COMT</p>
      </section>
      <nav class="nav screen-only">
        <a class="btn btn--primary" id="screen-link" href="../index.html">Wroc do indeksu</a>
        <a class="btn" id="screen-gene-link" href="#" hidden>Wersja ekranowa</a>
        <button type="button" class="btn btn--primary" id="print-btn">Drukuj</button>
      </nav>
      <article class="article print-article" id="gene-content"></article>
      <p class="status screen-only" id="gene-status">Ladowanie tresci...</p>
    </main>
    <script src="app.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const gene = (params.get("gene") || document.body.dataset.gene || "").trim().toUpperCase();

        const geneLink = document.getElementById("screen-gene-link");
        if (geneLink && gene) {
          geneLink.href = `${gene}.html`;
          geneLink.hidden = false;
          geneLink.textContent = `Wersja ekranowa (${gene})`;
        }

        const printBtn = document.getElementById("print-btn");
        if (printBtn) {
          printBtn.addEventListener("click", () => {
            if (typeof fitPrintPagesToSheet === "function") {
              fitPrintPagesToSheet();
            }
            window.print();
          });
        }
      })();
    </script>
  </body>
</html>
