<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenMarkerWiki — karty do druku</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <h1>Karty do druku</h1>
        <p>
          Układ 4-stronicowy (1–3, 4, 5–6, 7–8), jasny motyw.
          <a href="../index.html">Indeks genów</a>.
        </p>
      </section>
      <nav class="nav">
        <a class="btn btn--primary" href="../index.html">Wróć do indeksu</a>
      </nav>
      <section class="grid" id="print-grid"></section>
    </main>
    <script src="gene-index.js"></script>
    <script>
      const grid = document.getElementById("print-grid");
      grid.innerHTML = window.GENE_INDEX.map(
        ({ gene, label }) => `
        <a class="gene-card" href="print.html?gene=${encodeURIComponent(gene)}">
          <strong>${gene}</strong>
          <span>${label}</span>
        </a>`
      ).join("");
    </script>
  </body>
</html>
